# Render Blueprint for the Capstone Compass API.
# Optional convenience: import this repo at render.com/deploy and Render will
# read this file automatically. If the Blueprint schema has drifted since
# this was written, just create the service by hand in the dashboard instead -
# see DEPLOYMENT.md for the exact settings (build/start command, disk, env vars).
services:
  - type: web
    name: capstone-compass-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: compass-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: COMPASS_DATABASE_URL
        value: sqlite:////var/data/compass.db
      - key: COMPASS_ARTIFACTS_DIR
        value: /var/data/artifacts
      - key: COMPASS_AUTO_SEED
        value: "true"
      - key: COMPASS_CORS_ORIGINS
        value: http://localhost:3000
      - key: COMPASS_CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
