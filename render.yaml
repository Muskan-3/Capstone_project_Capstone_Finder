# Render Blueprint for the Capstone Compass API.
# Optional convenience: import this repo at render.com/deploy and Render will
# read this file automatically. If the Blueprint schema has drifted since
# this was written, just create the service by hand in the dashboard instead -
# see DEPLOYMENT.md for the exact settings.
#
# No persistent disk needed: the database and every trained model version
# live in Postgres (Supabase), not on local disk - COMPASS_DATABASE_URL below
# is marked `sync: false` so its value (with your real credentials) is
# entered once in the Render dashboard, never committed to the repo.
services:
  - type: web
    name: capstone-compass-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7 # numpy/scipy/scikit-learn have no wheels for 3.13+; pin to avoid a source build
      - key: COMPASS_DATABASE_URL
        sync: false # paste your Supabase "Session pooler" connection string here
      - key: COMPASS_AUTO_SEED
        value: "true"
      - key: COMPASS_CORS_ORIGINS
        value: http://localhost:3000
      - key: COMPASS_CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
